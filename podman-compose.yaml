# ruv-FANN Optimized Development Stack
# Single-service deployment with embedded databases

version: '3.8'

services:
  # Consolidated ruv-FANN service with all components
  ruv-fann-stack:
    build:
      context: .
      dockerfile: ContainerFile
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: ruv-fann:latest
    container_name: ruv-fann-stack
    hostname: ruv-fann
    init: true
    environment:
      # Core configuration
      - NODE_ENV=${NODE_ENV:-production}
      - MCP_SERVER_PORT=3000
      - CLAUDE_FLOW_ENABLED=true
      - DAA_ENABLED=true
      
      # Database configuration (embedded)
      - POSTGRES_DB=fanndb
      - POSTGRES_USER=fann
      - POSTGRES_PASSWORD=fann123
      - POSTGRES_URL=postgresql://fann:fann123@localhost:5432/fanndb
      - REDIS_URL=redis://localhost:6379
      - REDIS_MAXMEMORY=512mb
      
      # Neural and WASM features
      - WASM_SIMD_ENABLED=true
      - NEURAL_MODELS_PATH=/data/models
      - CUDA_WASM_PATH=/opt/ruv-fann/wasm/cuda
      - RUV_SWARM_WASM_PATH=/opt/ruv-fann/wasm/ruv-swarm
      
      # Syncthing mesh configuration
      - SYNCTHING_ENABLED=true
      - SYNCTHING_GUI_ADDRESS=0.0.0.0:8384
      - SYNCTHING_HOME=/data/sync
      - SYNCTHING_API_KEY=${SYNCTHING_API_KEY:-auto}
      
      # Performance tuning
      - RUST_LOG=${RUST_LOG:-info}
      - UV_THREADPOOL_SIZE=16
      - NODE_OPTIONS=--max-old-space-size=2048
      
      # Development helpers
      - DEVELOPMENT=${DEVELOPMENT:-false}
      - HOT_RELOAD=${HOT_RELOAD:-false}
      
    ports:
      - "3000:3000"       # MCP Server API
      - "5432:5432"       # PostgreSQL
      - "6379:6379"       # Redis
      - "8384:8384"       # Syncthing Web UI
      - "22000:22000"     # Syncthing protocol (TCP)
      - "22000:22000/udp" # Syncthing protocol (UDP)
      - "21027:21027/udp" # Syncthing discovery
      
    volumes:
      # Persistent data volumes
      - fann_postgres_data:/data/postgres:Z
      - fann_redis_data:/data/redis:Z
      - fann_models:/data/models:Z
      - fann_cache:/data/cache:Z
      - fann_sync:/data/sync:Z
      - fann_memory:/data/memory:Z
      - fann_logs:/data/logs:Z
      
      # Configuration mounts
      - ./config:/config:ro,Z
      - ./sql:/app/sql:ro,Z
      
      # Development mounts (conditional)
      - ${PWD}/mcp-server:/app/mcp-server:${DEVELOPMENT:+rw,}Z
      - ${PWD}/ruv-swarm/npm/src:/app/ruv-swarm/npm/src:${DEVELOPMENT:+rw,}Z
      
      # Podman socket for container management
      - /run/user/${UID:-1000}/podman/podman.sock:/var/run/podman.sock:ro
      
    security_opt:
      - label=disable
      
    tmpfs:
      - /tmp:noexec,nosuid,size=100M
      - /var/tmp:noexec,nosuid,size=50M
      
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      memlock:
        soft: -1
        hard: -1
        
    sysctls:
      - net.core.rmem_max=134217728
      - net.core.wmem_max=134217728
      - net.ipv4.tcp_rmem=4096 16384 134217728
      - net.ipv4.tcp_wmem=4096 65536 134217728
      
    restart: unless-stopped
    
    healthcheck:
      test: [
        "CMD-SHELL",
        "curl -f http://localhost:3000/health && redis-cli ping && pg_isready -h localhost -U fann"
      ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
      
    deploy:
      resources:
        limits:
          cpus: '6.0'
          memory: 12G
          pids: 1024
        reservations:
          cpus: '2.0'
          memory: 4G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s

# Named volumes for data persistence
volumes:
  fann_postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/postgres
      
  fann_redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/redis
      
  fann_models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/models
      
  fann_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/cache
      
  fann_sync:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/sync
      
  fann_memory:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/memory
      
  fann_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/logs

# Development override
# Use: podman-compose -f podman-compose.yaml -f podman-compose.dev.yaml up
configs:
  supervisor_config:
    file: ./config/supervisor.conf
    
  syncthing_config:
    file: ./config/syncthing/config.xml
    
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1