# ruv-FANN Production Stack
# Simplified, optimized for Podman Desktop and K8s

version: '3.8'

services:
  # All-in-one FANN service
  ruv-fann:
    build:
      context: .
      dockerfile: ContainerFile.production
    container_name: ruv-fann
    hostname: ruv-fann
    environment:
      - NODE_ENV=production
      - MCP_SERVER_PORT=3000
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://fann:fann123@postgres:5432/fanndb
      - SYNCTHING_API=http://localhost:8384
      - CLAUDE_FLOW_ENABLED=true
    ports:
      - "3000:3000"     # MCP Server
      - "8384:8384"     # Syncthing UI
      - "22000:22000"   # Syncthing
      - "21027:21027/udp" # Discovery
    volumes:
      - ./data:/data
      - ./config:/config
    depends_on:
      - redis
      - postgres
    networks:
      - fann-net
    restart: unless-stopped

  # Redis for caching/pub-sub
  redis:
    image: redis:7-alpine
    container_name: ruv-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - fann-net
    restart: unless-stopped

  # PostgreSQL for persistence
  postgres:
    image: postgres:15-alpine
    container_name: ruv-postgres
    environment:
      POSTGRES_DB: fanndb
      POSTGRES_USER: fann
      POSTGRES_PASSWORD: fann123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - fann-net
    restart: unless-stopped

networks:
  fann-net:
    driver: bridge

volumes:
  redis-data:
  postgres-data: