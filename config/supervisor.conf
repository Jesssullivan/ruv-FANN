[supervisord]
nodaemon=true
user=fann
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgres]
command=/usr/bin/postgres -D /data/postgres
user=fann
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres_err.log
priority=10

[program:redis]
command=/usr/bin/redis-server --dir /data/redis --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
user=fann
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis_err.log
priority=20

[program:syncthing]
command=/usr/bin/syncthing -no-browser -home=/data/sync
user=fann
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/syncthing.log
stderr_logfile=/var/log/supervisor/syncthing_err.log
priority=30

[program:mcp-server]
command=/usr/bin/node /app/mcp-server/server.js
user=fann
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/mcp.log
stderr_logfile=/var/log/supervisor/mcp_err.log
priority=40
depends_on=postgres,redis

[group:fann]
programs=postgres,redis,syncthing,mcp-server