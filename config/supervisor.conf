[supervisord]
nodaemon=true
user=fann
logfile=/data/logs/supervisor.log
logfile_maxbytes=50MB
logfile_backups=5
loglevel=info
pidfile=/var/run/supervisord.pid
childlogdir=/data/logs
minfds=65536
minprocs=200

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700
chown=fann:fann

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# PostgreSQL Database
[program:postgres]
command=/usr/bin/postgres -D /data/postgres -c config_file=/data/postgres/postgresql.conf
user=postgres
environment=PGDATA="/data/postgres",POSTGRES_DB="fanndb",POSTGRES_USER="fann",POSTGRES_PASSWORD="fann123"
autostart=true
autorestart=true
startsecs=10
startretries=3
stdout_logfile=/data/logs/postgres.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=3
stderr_logfile=/data/logs/postgres_err.log
stderr_logfile_maxbytes=100MB
stderr_logfile_backups=3
priority=10
stopsignal=INT
stopwaitsecs=30

# Redis Cache & Session Store
[program:redis]
command=/usr/bin/redis-server --dir /data/redis --dbfilename dump.rdb --appendonly yes --appendfilename appendonly.aof --maxmemory 512mb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10 --tcp-keepalive 60 --timeout 0
user=fann
environment=REDIS_PASSWORD=""
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/data/logs/redis.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile=/data/logs/redis_err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
priority=20
stopsignal=QUIT
stopwaitsecs=10

# Syncthing P2P File Synchronization
[program:syncthing]
command=/usr/bin/syncthing serve --no-browser --no-restart --home=/data/sync --gui-address=0.0.0.0:8384
user=fann
environment=STNORESTART="1",STNOUPGRADE="1",STGUIADDRESS="0.0.0.0:8384"
autostart=true
autorestart=true
startsecs=10
startretries=3
stdout_logfile=/data/logs/syncthing.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile=/data/logs/syncthing_err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
priority=30
stopsignal=TERM
stopwaitsecs=15

# MCP Server with Claude Flow Integration
[program:mcp-server]
command=/usr/bin/node --max-old-space-size=2048 --enable-source-maps /app/mcp-server/server.js
user=fann
directory=/app
environment=NODE_ENV="production",MCP_SERVER_PORT="3000",POSTGRES_URL="postgresql://fann:fann123@localhost:5432/fanndb",REDIS_URL="redis://localhost:6379",WASM_SIMD_ENABLED="true",CLAUDE_FLOW_ENABLED="true",DAA_ENABLED="true",NEURAL_MODELS_PATH="/data/models"
autostart=true
autorestart=true
startsecs=15
startretries=5
stdout_logfile=/data/logs/mcp.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=3
stderr_logfile=/data/logs/mcp_err.log
stderr_logfile_maxbytes=100MB
stderr_logfile_backups=3
priority=40
depends_on=postgres,redis
stopsignal=TERM
stopwaitsecs=30

# Neural Model Manager (Optional)
[program:neural-manager]
command=/opt/ruv-fann/bin/ruv-fann neural-server --port 8081 --models-path /data/models
user=fann
directory=/opt/ruv-fann
environment=RUST_LOG="info",NEURAL_MODELS_PATH="/data/models",WASM_SIMD_ENABLED="true"
autostart=false
autorestart=true
startsecs=10
startretries=3
stdout_logfile=/data/logs/neural.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile=/data/logs/neural_err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
priority=50
stopsignal=TERM
stopwaitsecs=20

# Health Monitor
[program:health-monitor]
command=/bin/bash -c 'while true; do curl -f http://localhost:3000/health >/dev/null 2>&1 || echo "$(date): Health check failed"; sleep 30; done'
user=fann
autostart=true
autorestart=true
startsecs=30
stdout_logfile=/data/logs/health.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=NONE
priority=60

# Service Groups
[group:database]
programs=postgres,redis

[group:networking]
programs=syncthing

[group:application]
programs=mcp-server,neural-manager

[group:monitoring]
programs=health-monitor