# Kubernetes Deployment for ruv-FANN with HPA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruv-fann
  namespace: ruv-fann
  labels:
    app: ruv-fann
    component: neural-engine
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ruv-fann
      component: neural-engine
  template:
    metadata:
      labels:
        app: ruv-fann
        component: neural-engine
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ruv-fann
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: ruv-fann
        image: quay.io/ruv-fann/neural-engine:latest
        imagePullPolicy: Always
        ports:
        - name: mcp
          containerPort: 3000
          protocol: TCP
        - name: syncthing-ui
          containerPort: 8384
          protocol: TCP
        - name: syncthing-api
          containerPort: 8385
          protocol: TCP
        - name: sync-tcp
          containerPort: 22000
          protocol: TCP
        - name: sync-udp
          containerPort: 21027
          protocol: UDP
        env:
        - name: NODE_ENV
          value: "production"
        - name: MCP_SERVER_PORT
          value: "3000"
        - name: SYNCTHING_ENABLED
          value: "true"
        - name: WASM_SIMD_ENABLED
          value: "true"
        - name: MAX_WORKERS
          value: "8"
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: ruv-fann-secrets
              key: redis-url
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: ruv-fann-secrets
              key: postgres-url
        - name: NEURAL_GPU_ENABLED
          value: "false"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: mcp
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: mcp
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: models
          mountPath: /data/models
        - name: sync
          mountPath: /data/sync
        - name: cache
          mountPath: /data/cache
        - name: syncthing-config
          mountPath: /config/syncthing
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: ruv-fann-models-pvc
      - name: sync
        persistentVolumeClaim:
          claimName: ruv-fann-sync-pvc
      - name: cache
        emptyDir:
          sizeLimit: 1Gi
      - name: syncthing-config
        configMap:
          name: syncthing-config
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - key: "neural-workload"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - ruv-fann
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: ruv-fann
  namespace: ruv-fann
  labels:
    app: ruv-fann
    component: neural-engine
spec:
  type: ClusterIP
  selector:
    app: ruv-fann
    component: neural-engine
  ports:
  - name: mcp
    port: 3000
    targetPort: mcp
    protocol: TCP
  - name: syncthing-ui
    port: 8384
    targetPort: syncthing-ui
    protocol: TCP
  - name: syncthing-api
    port: 8385
    targetPort: syncthing-api
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800