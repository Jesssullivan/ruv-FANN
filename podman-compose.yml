# RUV-FANN + HuskyCats Integrated Container Stack
# Production-ready podman-compose configuration with full service mesh
version: '3.8'

x-common-labels: &common-labels
  project: ruv-fann-integrated
  stack: neural-network
  environment: ${DEPLOY_ENV:-production}

x-logging: &default-logging
  driver: journald
  options:
    tag: "ruv-fann-{{.Name}}"

x-restart-policy: &restart-policy
  restart: unless-stopped

x-healthcheck: &default-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

services:
  # =============================================================================
  # CORE FANN SERVICES
  # =============================================================================
  
  ruv-fann-core:
    build:
      context: .
      dockerfile: container/ContainerFile.ruv-fann-core
      args:
        RUST_VERSION: "1.81"
        BUILD_FEATURES: "default,gpu,wasm,parallel,ruv-swarm"
    container_name: ruv-fann-core
    <<: *restart-policy
    labels:
      <<: *common-labels
      component: core
      service: neural-engine
    ports:
      - "${FANN_CORE_PORT:-8080}:8080"
      - "${FANN_CORE_METRICS_PORT:-8081}:8081"
    environment:
      # Core Configuration
      - RUST_LOG=${RUST_LOG:-info}
      - FANN_GPU_ENABLED=${FANN_GPU_ENABLED:-true}
      - FANN_WASM_THREADS=${FANN_WASM_THREADS:-8}
      - FANN_MODEL_CACHE_SIZE=${FANN_MODEL_CACHE_SIZE:-1000}
      - FANN_TRAINING_PARALLEL=${FANN_TRAINING_PARALLEL:-true}
      
      # Network Configuration
      - FANN_HOST=0.0.0.0
      - FANN_PORT=8080
      - FANN_METRICS_PORT=8081
      
      # Integration Configuration
      - SYNCTHING_PEER=syncthing-mesh:8384
      - SYNCTHING_API_KEY=${SYNCTHING_API_KEY}
      - MCP_SERVER_URL=http://huskycat-mcp:8080
      - REDIS_URL=redis://redis-cache:6379
      - DATABASE_URL=postgresql://${DB_USER:-ruvfann}:${DB_PASSWORD}@postgres-db:5432/${DB_NAME:-ruvfann}
      
      # Security
      - BEARER_TOKEN=${BEARER_TOKEN}
      - TLS_ENABLED=${TLS_ENABLED:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      # Model storage
      - fann-models:/opt/ruv-fann/models
      - fann-cache:/opt/ruv-fann/cache
      - fann-config:/opt/ruv-fann/config
      
      # Syncthing integration
      - syncthing-fann:/mnt/syncthing/fann:ro
      
      # Shared workspace
      - shared-workspace:/workspace
      
      # GPU access (if available)
      - /dev/dri:/dev/dri:rw
    devices:
      - /dev/nvidia0:/dev/nvidia0:rw
      - /dev/nvidiactl:/dev/nvidiactl:rw
      - /dev/nvidia-uvm:/dev/nvidia-uvm:rw
    networks:
      - ruv-fann-net
    depends_on:
      - postgres-db
      - redis-cache
      - syncthing-mesh
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 16G
        reservations:
          cpus: '2.0'
          memory: 4G
    logging: *default-logging
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]

  ruv-fann-training:
    build:
      context: .
      dockerfile: container/ContainerFile.ruv-fann-training
    container_name: ruv-fann-training
    <<: *restart-policy
    labels:
      <<: *common-labels
      component: training
      service: model-training
    ports:
      - "${FANN_TRAINING_PORT:-8082}:8080"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - TRAINING_QUEUE_SIZE=${TRAINING_QUEUE_SIZE:-100}
      - GPU_MEMORY_FRACTION=${GPU_MEMORY_FRACTION:-0.8}
      - DISTRIBUTED_TRAINING=${DISTRIBUTED_TRAINING:-true}
      - CHECKPOINT_INTERVAL=${CHECKPOINT_INTERVAL:-3600}
      - DATASET_CACHE_SIZE=${DATASET_CACHE_SIZE:-10000}
      - REDIS_URL=redis://redis-cache:6379
      - DATABASE_URL=postgresql://${DB_USER:-ruvfann}:${DB_PASSWORD}@postgres-db:5432/${DB_NAME:-ruvfann}
      - SYNCTHING_DATASETS_PATH=/mnt/syncthing/fann/datasets
    volumes:
      - fann-datasets:/opt/datasets
      - fann-checkpoints:/opt/checkpoints
      - fann-training-cache:/opt/cache
      - syncthing-fann:/mnt/syncthing/fann:ro
      - gpu-cache:/tmp/gpu-cache
      - /dev/shm:/dev/shm:rw
    devices:
      - /dev/nvidia0:/dev/nvidia0:rw
      - /dev/nvidiactl:/dev/nvidiactl:rw
      - /dev/nvidia-uvm:/dev/nvidia-uvm:rw
    networks:
      - ruv-fann-net
    depends_on:
      - ruv-fann-core
      - redis-cache
      - syncthing-mesh
    deploy:
      resources:
        limits:
          cpus: '16.0'
          memory: 64G
        reservations:
          cpus: '4.0'
          memory: 8G
    logging: *default-logging
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]

  ruv-fann-inference:
    build:
      context: .
      dockerfile: container/ContainerFile.ruv-fann-inference
    container_name: ruv-fann-inference
    <<: *restart-policy
    labels:
      <<: *common-labels
      component: inference
      service: model-serving
    ports:
      - "${FANN_INFERENCE_PORT:-8083}:8080"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - INFERENCE_BATCH_SIZE=${INFERENCE_BATCH_SIZE:-32}
      - INFERENCE_MAX_QUEUE=${INFERENCE_MAX_QUEUE:-1000}
      - INFERENCE_TIMEOUT=${INFERENCE_TIMEOUT:-30}
      - MODEL_CACHE_SIZE=${MODEL_CACHE_SIZE:-1000}
      - ENABLE_A_B_TESTING=${ENABLE_A_B_TESTING:-true}
      - REDIS_URL=redis://redis-cache:6379
      - PROMETHEUS_METRICS=true
      - METRICS_PORT=8081
    volumes:
      - fann-models:/opt/models:ro
      - inference-cache:/opt/cache
      - inference-metrics:/opt/metrics
    networks:
      - ruv-fann-net
    depends_on:
      - ruv-fann-core
      - redis-cache
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G
    logging: *default-logging
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s

  # =============================================================================
  # HUSKYCATS VALIDATION SERVICES
  # =============================================================================
  
  huskycat-mcp:
    build:
      context: ../huskycats-bates/mcp-server
      dockerfile: ContainerFile
    container_name: huskycat-mcp
    <<: *restart-policy
    labels:
      <<: *common-labels
      component: validation
      service: mcp-server
    ports:
      - "${MCP_SERVER_PORT:-8084}:8080"
    environment:
      # MCP Configuration
      - NODE_ENV=${NODE_ENV:-production}
      - MCP_PORT=8080
      - MCP_HOST=0.0.0.0
      - ENABLE_SYNCTHING=true
      
      # Integration Configuration
      - SYNCTHING_API_URL=http://syncthing-mesh:8384
      - SYNCTHING_API_KEY=${SYNCTHING_API_KEY}
      - CLAUDE_FLOW_INTEGRATION=true
      - FANN_CORE_URL=http://ruv-fann-core:8080
      - FANN_TRAINING_URL=http://ruv-fann-training:8080
      - FANN_INFERENCE_URL=http://ruv-fann-inference:8080
      
      # Security Configuration
      - BEARER_TOKEN=${BEARER_TOKEN}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-1000}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
      - ENABLE_CORS=true
      - ALLOWED_ORIGINS=${CORS_ORIGINS:-*}
      
      # Database Configuration
      - DATABASE_URL=postgresql://${DB_USER:-ruvfann}:${DB_PASSWORD}@postgres-db:5432/${DB_NAME:-ruvfann}
      - REDIS_URL=redis://redis-cache:6379
      
      # Logging Configuration
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENABLE_REQUEST_LOGGING=true
      - ENABLE_PERFORMANCE_LOGGING=true
    volumes:
      # Workspace and repositories
      - huskycat-workspace:/workspace
      - syncthing-repos:/mnt/syncthing/repositories:ro
      - validation-cache:/opt/cache
      
      # Configuration
      - huskycat-config:/opt/config
      
      # Shared workspace with FANN
      - shared-workspace:/shared:rw
      
      # Host podman socket for container operations
      - ${PODMAN_SOCKET:-/run/podman/podman.sock}:/run/podman/podman.sock:ro
    networks:
      - ruv-fann-net
    depends_on:
      - syncthing-mesh
      - postgres-db
      - redis-cache
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G
    logging: *default-logging
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]

  huskycat-validator:
    build:
      context: ../huskycats-bates
      dockerfile: ContainerFile.huskycat
    container_name: huskycat-validator
    <<: *restart-policy
    labels:
      <<: *common-labels
      component: validation
      service: code-validator
    environment:
      # Validation Configuration
      - VALIDATION_PARALLEL=${VALIDATION_PARALLEL:-true}
      - SECURITY_SCANNING=${SECURITY_SCANNING:-true}
      - AUTO_FIX_ENABLED=${AUTO_FIX_ENABLED:-true}
      - MAX_VALIDATION_TIME=${MAX_VALIDATION_TIME:-300}
      - VALIDATION_CACHE_TTL=${VALIDATION_CACHE_TTL:-3600}
      
      # Tool Configuration
      - PYTHON_TOOLS=black,flake8,mypy,pylint,bandit
      - JAVASCRIPT_TOOLS=eslint,prettier
      - DOCKER_TOOLS=hadolint
      - SHELL_TOOLS=shellcheck
      - YAML_TOOLS=yamllint
      
      # Integration Configuration
      - MCP_SERVER_URL=http://huskycat-mcp:8080
      - REDIS_URL=redis://redis-cache:6379
      
      # Resource Limits
      - MAX_MEMORY_USAGE=4G
      - MAX_CPU_USAGE=4
      - WORKER_PROCESSES=${WORKER_PROCESSES:-4}
    volumes:
      # Workspace for validation
      - huskycat-workspace:/workspace:rw
      - validation-tools:/opt/tools
      - validation-cache:/opt/cache
      - validation-reports:/opt/reports
      
      # Shared workspace
      - shared-workspace:/shared:rw
      
      # Repository access
      - syncthing-repos:/mnt/repositories:ro
    networks:
      - ruv-fann-net
    depends_on:
      - huskycat-mcp
      - redis-cache
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 16G
        reservations:
          cpus: '2.0'
          memory: 4G
    logging: *default-logging
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "/opt/huskycat/scripts/comprehensive-lint.sh", "--health-check"]

  # =============================================================================
  # SYNCTHING MESH NETWORK
  # =============================================================================
  
  syncthing-mesh:
    build:
      context: .
      dockerfile: container/ContainerFile.syncthing-mesh
    container_name: syncthing-mesh
    <<: *restart-policy
    labels:
      <<: *common-labels
      component: synchronization
      service: mesh-coordinator
    ports:
      - "${SYNCTHING_GUI_PORT:-8385}:8384"   # Web GUI
      - "${SYNCTHING_SYNC_PORT:-22000}:22000/tcp" # Sync protocol
      - "${SYNCTHING_SYNC_UDP_PORT:-22000}:22000/udp" # QUIC transfers
      - "${SYNCTHING_DISCOVERY_PORT:-21027}:21027/udp" # Discovery broadcasts
    environment:
      # Syncthing Configuration
      - STGUIADDRESS=0.0.0.0:8384
      - STGUIAPIKEY=${SYNCTHING_API_KEY}
      - STNORESTART=1
      - STHOMEDIR=/var/syncthing/config
      
      # Mesh Configuration
      - MESH_MODE=${MESH_MODE:-coordinator}
      - FANN_SYNC_ENABLED=${FANN_SYNC_ENABLED:-true}
      - AUTO_ACCEPT_FOLDERS=${AUTO_ACCEPT_FOLDERS:-true}
      - ENABLE_RELAYS=${ENABLE_RELAYS:-true}
      - ENABLE_NAT_TRAVERSAL=${ENABLE_NAT_TRAVERSAL:-true}
      
      # Coordination Configuration
      - SYNC_INTERVAL=${SYNC_INTERVAL:-300}
      - CLEANUP_INTERVAL=${CLEANUP_INTERVAL:-3600}
      - CONFLICT_RESOLUTION=${CONFLICT_RESOLUTION:-latest}
      
      # Performance Configuration
      - MAX_SEND_KBPS=${MAX_SEND_KBPS:-0}
      - MAX_RECV_KBPS=${MAX_RECV_KBPS:-0}
      - RESCAN_INTERVAL=${RESCAN_INTERVAL:-3600}
      - FS_WATCHER_ENABLED=${FS_WATCHER_ENABLED:-true}
      - FS_WATCHER_DELAY=${FS_WATCHER_DELAY:-10}
    volumes:
      # Syncthing configuration with proper permissions
      - syncthing-config:/var/syncthing/config
      
      # FANN specific data
      - syncthing-fann:/var/syncthing/fann
      
      # Repository synchronization
      - syncthing-repos:/var/syncthing/repositories
      
      # Shared data across services
      - syncthing-shared:/var/syncthing/shared
      
      # Backup and versioning
      - syncthing-versions:/var/syncthing/.stversions
    networks:
      - ruv-fann-net
    user: "1000:1000"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging: *default-logging
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-f", "-H", "X-API-Key: ${SYNCTHING_API_KEY}", "http://localhost:8384/rest/system/ping"]

  # =============================================================================
  # DATABASE AND CACHE SERVICES
  # =============================================================================
  
  postgres-db:
    image: postgres:15-alpine
    container_name: ruv-fann-postgres
    <<: *restart-policy
    labels:
      <<: *common-labels
      component: database
      service: postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-ruvfann}
      - POSTGRES_USER=${DB_USER:-ruvfann}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-backups:/var/lib/postgresql/backups
      - ./config/postgres/init-db.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./config/postgres/extensions.sql:/docker-entrypoint-initdb.d/002-extensions.sql:ro
    networks:
      - ruv-fann-net
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G
    logging: *default-logging
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ruvfann} -d ${DB_NAME:-ruvfann}"]

  redis-cache:
    image: redis:7-alpine
    container_name: ruv-fann-redis
    <<: *restart-policy
    labels:
      <<: *common-labels
      component: cache
      service: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: |
      redis-server 
      --appendonly yes 
      --maxmemory ${REDIS_MAX_MEMORY:-4gb} 
      --maxmemory-policy allkeys-lru 
      --save 900 1 
      --save 300 10 
      --save 60 10000
      --tcp-keepalive 300
      --timeout 0
      --tcp-backlog 511
    volumes:
      - redis-data:/data
      - redis-config:/usr/local/etc/redis
    networks:
      - ruv-fann-net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 6G
        reservations:
          cpus: '0.5'
          memory: 2G
    logging: *default-logging
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s

  # =============================================================================
  # MONITORING AND OBSERVABILITY
  # =============================================================================
  
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: ruv-fann-prometheus
    <<: *restart-policy
    labels:
      <<: *common-labels
      component: monitoring
      service: prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.enable-lifecycle'
      - '--web.route-prefix=/'
      - '--web.external-url=http://localhost:9090'
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules/:/etc/prometheus/rules/:ro
      - prometheus-data:/prometheus
    networks:
      - ruv-fann-net
    depends_on:
      - ruv-fann-core
      - huskycat-mcp
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging: *default-logging
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]

  grafana:
    image: grafana/grafana:10.1.0
    container_name: ruv-fann-grafana
    <<: *restart-policy
    labels:
      <<: *common-labels
      component: monitoring
      service: grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      # Admin Configuration
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      
      # Security Configuration
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      
      # Database Configuration
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=postgres-db:5432
      - GF_DATABASE_NAME=${DB_NAME:-ruvfann}
      - GF_DATABASE_USER=${DB_USER:-ruvfann}
      - GF_DATABASE_PASSWORD=${DB_PASSWORD}
      - GF_DATABASE_SSL_MODE=disable
      
      # Session Configuration
      - GF_SESSION_PROVIDER=redis
      - GF_SESSION_PROVIDER_CONFIG=addr=redis-cache:6379,pool_size=100,db=grafana
      
      # Server Configuration
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      
      # Plugins Configuration
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource,grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - grafana-logs:/var/log/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - ruv-fann-net
    depends_on:
      - prometheus
      - postgres-db
      - redis-cache
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    logging: *default-logging
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]

  # =============================================================================
  # REVERSE PROXY AND LOAD BALANCER
  # =============================================================================
  
  traefik:
    image: traefik:v3.0
    container_name: ruv-fann-traefik
    <<: *restart-policy
    labels:
      <<: *common-labels
      component: proxy
      service: load-balancer
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@ruv-fann.local}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
      - "--accesslog=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${PODMAN_SOCKET:-/run/podman/podman.sock}:/var/run/docker.sock:ro
      - traefik-acme:/acme.json
      - traefik-logs:/logs
    networks:
      - ruv-fann-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging: *default-logging
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "traefik", "healthcheck"]
    profiles:
      - proxy

# =============================================================================
# NETWORK CONFIGURATION
# =============================================================================

networks:
  ruv-fann-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1
    driver_opts:
      com.docker.network.bridge.name: ruv-fann-br
      com.docker.network.bridge.enable_ip_masquerade: 'true'
      com.docker.network.bridge.enable_icc: 'true'
      com.docker.network.driver.mtu: 1500

# =============================================================================
# VOLUME CONFIGURATION
# =============================================================================

volumes:
  # FANN Core Volumes
  fann-models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT:-./data}/fann/models
  fann-datasets:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT:-./data}/fann/datasets
  fann-checkpoints:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT:-./data}/fann/checkpoints
  fann-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT:-./data}/fann/cache
  fann-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CONFIG_ROOT:-./config}/fann
  fann-training-cache:
    driver: local
  inference-cache:
    driver: local
  inference-metrics:
    driver: local
  gpu-cache:
    driver: local

  # HuskyCat Volumes
  huskycat-workspace:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT:-./data}/huskycat/workspace
  huskycat-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CONFIG_ROOT:-./config}/huskycat
  validation-cache:
    driver: local
  validation-tools:
